<header class="site-header">
  <div class="container">
    <a class="site-branding" href="{{ '/' | relative_url }}">
      <img class="site-logo" src="{{ '/assets/images/site/logo.svg' | relative_url }}" alt="{{ site.title }} logo" width="42" height="42">
      <span class="site-title-group">
        <span class="site-title">{{ site.title }}</span>
        <span class="site-tagline">{{ site.tagline }}</span>
      </span>
    </a>

    <button class="nav-toggle" aria-expanded="false" aria-controls="main-nav" id="nav-toggle">
      <span class="menu-icon" aria-hidden="true"><i></i><i></i><i></i></span>
      Menu
    </button>

    <nav class="main-nav" id="main-nav" aria-label="Primary">
      <ul>
        {% for item in site.nav %}
        {% assign item_url = item.url | relative_url %}
        {% if item.url == "/" %}
          {% assign is_active = page.url == "/" %}
        {% else %}
          {% assign is_active = page.url contains item.url %}
        {% endif %}
        <li>
          <a href="{{ item_url }}"
             {% if is_active %}aria-current="page"{% endif %}>
            {{ item.title }}
          </a>
        </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
