<meta charset="utf-8">
<meta http-equiv="x-ua-compatible" content="ie=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="{{ site.theme.colors.primary }}">

{% seo title=false %}
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>

<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/assets/images/site/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }} News" href="{{ '/news/feed.xml' | relative_url }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{ site.theme.font.google_font_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

{% feed_meta %}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ResearchOrganization",
  "name": "{{ site.title }}",
  "alternateName": "{{ site.tagline }}",
  "url": "{{ site.url }}{{ site.baseurl }}/",
  "parentOrganization": {
    "@type": "CollegeOrUniversity",
    "name": "{{ site.organisation }}"
  },
  "department": "{{ site.faculty }}",
  "email": "{{ site.email }}",
  "description": "{{ site.description | strip_newlines }}"
}
</script>
