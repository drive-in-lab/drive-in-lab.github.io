---
layout: default
---
<article class="section">
  <div class="container">
    <header class="section-header">
      {% if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}<p>{{ page.subtitle }}</p>{% endif %}
    </header>
    <div class="page-content">
      {{ content }}
    </div>
  </div>
</article>
