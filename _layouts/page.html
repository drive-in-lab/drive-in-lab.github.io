---
layout: default
---
<header class="page-heading">
  <div class="container">
    {% if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p>{{ page.subtitle }}</p>{% endif %}
  </div>
</header>

<article class="section">
  <div class="container page-content" style="max-width: 78ch;">
    {{ content }}
  </div>
</article>
