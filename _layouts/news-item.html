---
layout: default
---
<article class="section">
  <div class="container" style="max-width: 80ch;">
    <p><a href="{{ '/news/' | relative_url }}">&larr; All news</a></p>
    <span class="eyebrow">{{ page.date | date: "%-d %B %Y" }}{% if page.category %} · {{ page.category }}{% endif %}</span>
    <h1>{{ page.title }}</h1>
    {% if page.image %}
    <img src="{{ page.image | relative_url }}" alt="" style="border-radius: var(--radius); border: 1px solid var(--color-border); margin-bottom: var(--space-3);">
    {% endif %}
    <div class="page-content">
      {{ content }}
    </div>
  </div>
</article>
